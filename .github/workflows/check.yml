name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5.0
      - run: opam install ./backend --deps-only --with-test --locked --yes
      - run: opam exec -- dune build --root backend
      - run: opam exec -- dune runtest --root backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: opam exec -- dune build --root backend test/replay_day.exe
      - name: Compare the complete API day with the provider fixtures
        run: |
          backend/_build/default/test/replay_day.exe 2026-10-25 tests/source-records > "$RUNNER_TEMP/dashboard-day.json"
          python3 tests/verify_source.py "$RUNNER_TEMP/dashboard-day.json" tests/source-records
      - run: npx playwright test tests/source-numbers.spec.ts tests/daily-summary.spec.ts tests/refresh.spec.ts
        env:
          REPLAY_ONLY: "1"
          PLAYWRIGHT_CHANNEL: chromium

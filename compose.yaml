services:
  api:
    build: ./backend
    restart: unless-stopped
    volumes:
      - energy-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  energy-data:
